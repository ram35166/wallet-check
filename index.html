<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Exposure Check</title>
<style>
  :root { --bg:#eef2f6; --ink:#14213d; --muted:#5b6b82; --line:#cfd8e3; --card:#ffffff; --accent:#1d4ed8; --warn:#b45309; --warnbg:#fef3c7; --ok:#166534; --okbg:#dcfce7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1724; --ink:#e6edf7; --muted:#9fb0c8; --line:#26334a; --card:#172033; --accent:#6ea0ff; --warn:#fcd34d; --warnbg:#3a2c0b; --ok:#86efac; --okbg:#0f2f1c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 1.9rem; line-height:1.2; margin:0 0 10px; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  label { display:block; font-weight:600; margin-bottom:8px; }
  input { width:100%; padding:14px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-family: ui-monospace, Menlo, monospace; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { margin-top:12px; width:100%; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:24px; }
  .box { padding:18px; border-radius:8px; border:1px solid var(--line); background:var(--card); }
  .warn { background:var(--warnbg); color:var(--warn); border-color:var(--warn); }
  .ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
  .box h2 { margin:0 0 8px; font-size:1.15rem; }
  .box p { margin:0 0 8px; }
  .box p:last-child { margin:0; }
  small { display:block; margin-top:28px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Has your wallet exposed its public key?</h1>
  <p class="lead">Paste an Ethereum address. We only read public blockchain data. We never ask for a seed phrase or private key.</p>

  <label for="addr">Ethereum address</label>
  <input id="addr" placeholder="0x..." autocomplete="off" spellcheck="false">
  <button id="go">Check this address</button>

  <div id="result" aria-live="polite"></div>

  <small>Ethereum mainnet only for now. This checks key exposure, not whether you have been hacked. Never enter your seed phrase anywhere.</small>
</main>

<script>
const input = document.getElementById("addr");
const btn = document.getElementById("go");
const out = document.getElementById("result");

function show(cls, title, lines) {
  out.textContent = "";
  const box = document.createElement("div");
  box.className = "box " + cls;
  const h = document.createElement("h2");
  h.textContent = title;
  box.appendChild(h);
  lines.forEach(t => { const p = document.createElement("p"); p.textContent = t; box.appendChild(p); });
  out.appendChild(box);
}

async function check() {
  const address = input.value.trim();
  if (!address) { show("", "Paste an address first", ["It starts with 0x and has 42 characters."]); return; }
  btn.disabled = true; btn.textContent = "Checking...";
  try {
    const r = await fetch("/api/check?address=" + encodeURIComponent(address));
    const d = await r.json();
    if (!r.ok) { show("warn", "Could not check", [d.error || "Unknown error."]); return; }

    if (d.isContract) {
      show("", "This is a smart contract wallet", ["It does not work like a normal key-based address, so this test does not apply the same way."]);
    } else if (d.exposed) {
      const when = new Date(d.firstSent.time).toLocaleDateString();
      show("warn", "Public key exposed", [
        "This address has sent transactions" + (d.capped ? " (at least " + d.sentCount + " in its first 1000)" : " (" + d.sentCount + ")") + ", starting " + when + ".",
        "Each one put its public key on the blockchain permanently. This does not mean you were hacked. It is a long-term risk, especially for large savings.",
        "A safer habit: keep long-term savings on a fresh address that has only received funds and never sent anything."
      ]);
    } else {
      show("ok", "Not exposed yet", [
        "This address has only received funds, so its public key has not been revealed on-chain.",
        "Tip: sending from it for the first time will expose the key, so move savings to a new address instead."
      ]);
    }
  } catch (e) {
    show("warn", "Could not check", ["Network problem. Try again."]);
  } finally {
    btn.disabled = false; btn.textContent = "Check this address";
  }
}
btn.addEventListener("click", check);
input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
</script>
</body>
</html>
